{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fti.fullname" . }}
  labels: {{- include "fti.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.parent.name }}
    namespace: {{ .Values.gateway.parent.namespace }}
  hostnames:
  - {{ required "gateway.host jest wymagany" .Values.gateway.host | quote }}
  rules:
  - backendRefs:
    - name: {{ include "fti.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
