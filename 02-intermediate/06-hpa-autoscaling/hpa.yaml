apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference
  labels:
    part-of: fti
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60       # % z requests.cpu (100m)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 60   # domyślnie 300 s; krócej na potrzeby laba
