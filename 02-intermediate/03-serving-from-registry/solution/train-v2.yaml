apiVersion: batch/v1
kind: Job
metadata:
  name: train-v2
  labels:
    part-of: fti
    model-version: v2
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: training
        model-version: v2
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: fti-lab:0.1
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "fti.train"]
        env:
        - { name: MODEL_VERSION, value: v2 }
        - { name: MODEL_DIR,     value: /models/v2 }
        - { name: FEATURES_PATH, value: /data/features/latest.csv }
        - { name: N_ESTIMATORS,  value: "200" }
        - { name: MIN_ACCURACY,  value: "0.80" }
        volumeMounts:
        - { name: features, mountPath: /data/features, readOnly: true }
        - { name: models,   mountPath: /models }
      volumes:
      - name: features
        persistentVolumeClaim: { claimName: features, readOnly: true }
      - name: models
        persistentVolumeClaim: { claimName: model-store }
