apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ml-prod
resources:
- namespace.yaml
- ../../base
- httproute.yaml
configMapGenerator:
- name: inference-config
  behavior: merge
  literals:
  - LOG_LEVEL=WARNING
  - MODEL_VERSION=v1
images:
- name: fti-lab
  newTag: "0.1"
patches:
- path: patch-deployment.yaml
