# 1) Rejestr modeli: STATYCZNY PV na katalogu współdzielonym przez wszystkie węzły kind
#    (/mnt/shared = $LAB_DATA na hoście). Udaje NFS/EFS -> ReadWriteMany.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-store
  labels:
    part-of: fti
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain     # modeli nie kasujemy razem z PVC
  storageClassName: ""                      # "" = bez dynamicznego provisioningu
  hostPath:
    path: /mnt/shared/models
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
  labels:
    part-of: fti
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: model-store                   # wiązanie 1:1 z PV powyżej
  resources:
    requests:
      storage: 5Gi
---
# 2) Offline feature store: DYNAMICZNY PVC z domyślnej StorageClass kind ("standard",
#    local-path, RWO, WaitForFirstConsumer).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: features
  labels:
    part-of: fti
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
