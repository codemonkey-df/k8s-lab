# Jednorazowy trening zapisujący model do rejestru (zamiast /tmp z B03)
apiVersion: v1
kind: Pod
metadata:
  name: train-to-registry
  labels:
    app: training
    part-of: fti
spec:
  restartPolicy: Never
  containers:
  - name: train
    image: fti-lab:0.1
    imagePullPolicy: IfNotPresent
    command: ["python", "-m", "fti.train", "--out", "/models/v0", "--version", "v0"]
    volumeMounts:
    - name: models
      mountPath: /models
  volumes:
  - name: models
    persistentVolumeClaim:
      claimName: model-store
