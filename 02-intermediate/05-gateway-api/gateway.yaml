# GatewayClass z od razu podpiętym EnvoyProxy (hostPort 80/443 na control-plane kind)
# — bez osobnego `kubectl patch gatewayclass`.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-control-plane
    namespace: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
# Gateway należy do zespołu platformy (namespace infra); zespoły ML podpinają
# swoje HTTPRoute z własnych namespace'ów (ml, llm) — rozdział ról z Gateway API.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ml-gateway
  namespace: infra
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
