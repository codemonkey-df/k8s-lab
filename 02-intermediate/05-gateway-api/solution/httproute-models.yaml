# "API gateway dla modeli": /models/wine/<cokolwiek> -> inference /<cokolwiek>
# Kolejny model = kolejna reguła (np. /models/llm -> Service ollama w namespace llm).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models
  labels:
    part-of: fti
spec:
  parentRefs:
  - name: ml-gateway
    namespace: infra
  hostnames:
  - api.127-0-0-1.nip.io
  rules:
  - matches:
    - path: { type: PathPrefix, value: /models/wine }
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - { name: x-served-by, value: fti-inference }
    backendRefs:
    - name: inference
      port: 80
