apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  labels:
    part-of: fti
spec:
  parentRefs:
  - name: ml-gateway
    namespace: infra
  hostnames:
  - ml.127-0-0-1.nip.io
  rules:
  - matches:
    - path: { type: PathPrefix, value: /predict }
    - path: { type: Exact, value: /version }
    backendRefs:
    - name: inference
      port: 80
