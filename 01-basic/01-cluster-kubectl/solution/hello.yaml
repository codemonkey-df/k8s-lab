# Wygenerowane: kubectl create deployment hello --image=busybox:1.36 --replicas=2 --dry-run=client -o yaml -- sleep infinity
# + ręcznie: etykieta part-of w szablonie Poda, requests; usunięte puste pola (creationTimestamp, strategy: {}, status: {}).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
        part-of: fti
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "infinity"]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
