# Pod, który przekracza limit pamięci -> OOMKilled
apiVersion: v1
kind: Pod
metadata:
  name: oom
spec:
  restartPolicy: Never
  containers:
  - name: hog
    image: fti-lab:0.1
    imagePullPolicy: IfNotPresent
    command: ["python", "-c", "x = bytearray(512 * 1024 * 1024); print('zaalokowano')"]
    resources:
      requests: { memory: 64Mi, cpu: 50m }
      limits:   { memory: 128Mi }
