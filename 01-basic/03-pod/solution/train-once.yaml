apiVersion: v1
kind: Pod
metadata:
  name: train-once
  labels:
    app: training
    part-of: fti
spec:
  restartPolicy: Never          # domyślnie Always -> trening wykonywałby się w pętli
  containers:
  - name: train
    image: fti-lab:0.1
    imagePullPolicy: IfNotPresent
    command: ["python", "-m", "fti.train"]
    args: ["--out", "/tmp/model", "--version", "pod-run"]
