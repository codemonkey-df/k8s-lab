apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-01, namespace: debug }
spec:
  selector: { matchLabels: { app: broken-01 } }
  template:
    metadata: { labels: { app: broken-01 } }
    spec:
      containers:
      - name: server
        image: fti-lab:0.2
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
