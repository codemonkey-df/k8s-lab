apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: broken-07, namespace: debug }
spec:
  storageClassName: fast-nvme
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Pod
metadata: { name: broken-07, namespace: debug }
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts: [{ name: d, mountPath: /data }]
  volumes:
  - name: d
    persistentVolumeClaim: { claimName: broken-07 }
