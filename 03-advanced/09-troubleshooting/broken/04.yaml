apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-04, namespace: debug }
spec:
  replicas: 2
  selector: { matchLabels: { app: broken-04 } }
  template:
    metadata: { labels: { app: broken-04 } }
    spec:
      containers:
      - name: server
        image: fti-lab:0.1
        imagePullPolicy: IfNotPresent
        env: [{ name: MODEL_PATH, value: /models/v1/model.joblib }]
        ports: [{ containerPort: 8080, name: http }]
        readinessProbe: { httpGet: { path: /ready, port: http } }
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
