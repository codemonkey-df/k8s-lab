# Canary 90/10 + "ręczny test" nowej wersji nagłówkiem x-model-version: v2
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wine
  labels: { part-of: fti }
spec:
  parentRefs:
  - { name: ml-gateway, namespace: infra }
  hostnames: [wine.127-0-0-1.nip.io]
  rules:
  - matches:
    - headers:
      - { name: x-model-version, value: v2 }
    backendRefs:
    - { name: wine-v2, port: 80 }
  - backendRefs:
    - { name: wine-v1, port: 80, weight: 90 }
    - { name: wine-v2, port: 80, weight: 10 }
