# Promocja: 100% ruchu do v2 (v1 zostaje przeskalowany do 0 — szybki rollback = poprzedni plik route)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wine
  labels: { part-of: fti }
spec:
  parentRefs:
  - { name: ml-gateway, namespace: infra }
  hostnames: [wine.127-0-0-1.nip.io]
  rules:
  - backendRefs:
    - { name: wine-v2, port: 80 }
