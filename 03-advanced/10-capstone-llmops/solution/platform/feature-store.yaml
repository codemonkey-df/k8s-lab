apiVersion: v1
kind: Service
metadata: { name: feature-store, namespace: ml, labels: { app: feature-store, part-of: fti } }
spec:
  clusterIP: None
  selector: { app: feature-store }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: feature-store, namespace: ml, labels: { app: feature-store, part-of: fti } }
spec:
  serviceName: feature-store
  replicas: 1
  selector: { matchLabels: { app: feature-store } }
  template:
    metadata: { labels: { app: feature-store, part-of: fti } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--appendonly", "yes"]
        ports: [{ containerPort: 6379, name: redis }]
        readinessProbe: { tcpSocket: { port: redis } }
        livenessProbe: { exec: { command: ["redis-cli", "ping"] } }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { memory: 256Mi }
        volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 1Gi } }
