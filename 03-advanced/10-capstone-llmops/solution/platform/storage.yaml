apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-store
  labels: { part-of: fti }
spec:
  capacity: { storage: 5Gi }
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: { path: /mnt/shared/models, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: model-store, namespace: ml, labels: { part-of: fti } }
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: model-store
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: features, namespace: ml, labels: { part-of: fti } }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
