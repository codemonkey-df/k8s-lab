apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: ml
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: objects
  namespace: ml
spec:
  hard:
    pods: "30"
    count/jobs.batch: "15"
    services.nodeports: "0"      # na zewnątrz tylko przez Gateway
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ml
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: 100m, memory: 128Mi }
    default: { memory: 512Mi }
