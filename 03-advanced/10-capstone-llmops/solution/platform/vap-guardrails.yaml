# Guardrails platformy ML (ValidatingAdmissionPolicy, CEL — bez webhooków):
#  A) workloady serwujące: requests CPU/RAM, limit RAM, zakaz :latest
#  B) Joby: activeDeadlineSeconds (żaden trening nie trzyma GPU w nieskończoność)
#     i ttlSecondsAfterFinished (sprzątanie)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ml-workload-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "statefulsets"]
  variables:
  - name: containers
    expression: object.spec.template.spec.containers
  validations:
  - expression: >-
      variables.containers.all(c, has(c.resources) && has(c.resources.requests)
      && 'cpu' in c.resources.requests && 'memory' in c.resources.requests)
    message: "Każdy kontener musi mieć requests.cpu i requests.memory."
  - expression: >-
      variables.containers.all(c, has(c.resources.limits) && 'memory' in c.resources.limits)
    message: "Każdy kontener musi mieć limits.memory."
  - expression: >-
      variables.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
    message: "Obraz musi mieć jawny tag inny niż :latest (powtarzalność wersji modelu)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ml-job-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["jobs"]
  validations:
  - expression: "has(object.spec.activeDeadlineSeconds)"
    message: "Job musi mieć activeDeadlineSeconds (limit czasu treningu)."
  - expression: "has(object.spec.ttlSecondsAfterFinished)"
    message: "Job musi mieć ttlSecondsAfterFinished."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ml-workload-guardrails
spec:
  policyName: ml-workload-guardrails
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels: { policy.fti/guardrails: "enabled" }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ml-job-guardrails
spec:
  policyName: ml-job-guardrails
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels: { policy.fti/guardrails: "enabled" }
