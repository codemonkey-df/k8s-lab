# Inference: priorytet krytyczny, repliki rozłożone po węzłach, PDB chroni przed drain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-ha
  labels: { part-of: fti }
spec:
  replicas: 4
  selector:
    matchLabels: { app: inference-ha }
  template:
    metadata:
      labels: { app: inference-ha, part-of: fti }
    spec:
      priorityClassName: inference-critical
      tolerations:
      - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        # Domyślne Ignore liczy też control-plane (taint, na który nie mamy toleration)
        # jako domenę z 0 Podów -> maxSkew 1 = max 1 replika na worker, reszta Pending.
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels: { app: inference-ha }
      containers:
      - name: server
        image: fti-lab:0.1
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080, name: http }]
        readinessProbe:
          httpGet: { path: /ready, port: http }
        resources:
          requests: { cpu: "2", memory: 256Mi }
          limits:   { memory: 512Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-ha
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: inference-ha }
