# Single-node multi-GPU training: cały węzeł (4 GPU). 8 GPU -> Pending na zawsze
# (scheduler nie dzieli jednego Poda na węzły — to robi PyTorchJob/MPIJob z wieloma Podami).
apiVersion: v1
kind: Pod
metadata:
  name: multi-gpu-train
  labels: { workload: training }
spec:
  restartPolicy: Never
  tolerations:
  - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
  containers:
  - name: trainer
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 4
        cpu: "2"
        memory: 2Gi
