# MIG: małe inference na 1g.5gb + średni fine-tuning na 3g.20gb (geometria A100 40GB)
apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Pod
  metadata:
    name: inference-mig-1
    labels: { mig-demo: "true", mig-profile: 1g.5gb }
  spec:
    tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
    containers:
    - { name: app, image: busybox:1.36, command: ["sleep", "3600"],
        resources: { limits: { nvidia.com/mig-1g.5gb: 1 } } }
- apiVersion: v1
  kind: Pod
  metadata:
    name: inference-mig-2
    labels: { mig-demo: "true", mig-profile: 1g.5gb }
  spec:
    tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
    containers:
    - { name: app, image: busybox:1.36, command: ["sleep", "3600"],
        resources: { limits: { nvidia.com/mig-1g.5gb: 1 } } }
- apiVersion: v1
  kind: Pod
  metadata:
    name: finetune-mig-3g
    labels: { mig-demo: "true", mig-profile: 3g.20gb }
  spec:
    tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
    containers:
    - { name: app, image: busybox:1.36, command: ["sleep", "3600"],
        resources: { limits: { nvidia.com/mig-3g.20gb: 1 } } }
