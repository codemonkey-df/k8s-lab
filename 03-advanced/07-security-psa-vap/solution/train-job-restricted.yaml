# Zadanie A: Job treningowy, który przechodzi PSA restricted i VAP ml-job-guardrails
# (activeDeadlineSeconds + ttlSecondsAfterFinished są już w I02).
apiVersion: batch/v1
kind: Job
metadata:
  name: train-v3
  labels:
    part-of: fti
    model-version: v3
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: training
        part-of: fti
        model-version: v3
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: fti-lab:0.1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - fti.train
        env:
        - name: MODEL_VERSION
          value: v3
        - name: MODEL_DIR
          value: /models/v3
        - name: FEATURES_PATH
          value: /data/features/latest.csv
        - name: N_ESTIMATORS
          value: '10'
        - name: MAX_DEPTH
          value: '2'
        - name: MIN_ACCURACY
          value: '0.80'
        volumeMounts:
        - name: features
          mountPath: /data/features
          readOnly: true
        - name: models
          mountPath: /models
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: features
        persistentVolumeClaim:
          claimName: features
          readOnly: true
      - name: models
        persistentVolumeClaim:
          claimName: model-store
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
