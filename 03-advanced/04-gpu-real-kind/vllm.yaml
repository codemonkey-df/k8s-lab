# vLLM (serwer OpenAI-compatible) z małym modelem na 1 GPU.
# Obraz ~10 GB, model pobierany z Hugging Face przy starcie -> długi startupProbe.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: llm
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
spec:
  replicas: 1
  strategy: { type: Recreate }      # 1 GPU -> dwie wersje naraz się nie zmieszczą
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest        # przypnij wersję po pierwszym udanym starcie
        args:
        - --model=Qwen/Qwen2.5-1.5B-Instruct
        - --served-model-name=qwen
        - --gpu-memory-utilization=0.80
        - --max-model-len=4096
        ports: [{ containerPort: 8000, name: http }]
        env:
        - { name: HF_HOME, value: /cache }
        # - name: HF_TOKEN   # dla modeli z bramką (Llama) — Secret z B07
        #   valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } }
        startupProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          failureThreshold: 90            # do 15 min na pobranie + załadowanie
        readinessProbe:
          httpGet: { path: /health, port: http }
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits:   { memory: 16Gi, nvidia.com/gpu: 1 }
        volumeMounts:
        - { name: cache, mountPath: /cache }
        - { name: shm,   mountPath: /dev/shm }
      volumes:
      - name: cache
        persistentVolumeClaim: { claimName: hf-cache }
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
spec:
  selector: { app: vllm }
  ports: [{ name: http, port: 80, targetPort: http }]
