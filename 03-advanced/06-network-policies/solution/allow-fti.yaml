# 1) Gateway (Pody Envoya w envoy-gateway-system) -> inference i wine-* :8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-from-gateway
spec:
  podSelector:
    matchExpressions:
    - { key: app, operator: In, values: [inference, wine] }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
    ports: [{ port: 8080 }]
  # 2) Prometheus (A08) -> /metrics
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
    ports: [{ port: 8080 }]
---
# 3) inference -> feature store (egress po stronie klienta)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-to-feature-store
spec:
  podSelector:
    matchLabels: { app: inference }
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: { matchLabels: { app: feature-store } }
    ports: [{ port: 6379 }]
---
# 4) feature store przyjmuje TYLKO od inference i feature-pipeline
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feature-store-ingress
spec:
  podSelector:
    matchLabels: { app: feature-store }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: inference } }
    - podSelector: { matchLabels: { app: feature-pipeline } }
    ports: [{ port: 6379 }]
---
# 5) feature-pipeline -> feature store
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feature-pipeline-egress
spec:
  podSelector:
    matchLabels: { app: feature-pipeline }
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: { matchLabels: { app: feature-store } }
    ports: [{ port: 6379 }]
