# Prometheus Operator scrape'uje Pody inference po etykietach (bez Service)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fti-inference
  namespace: ml
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
    - { key: app, operator: In, values: [inference, wine] }
  podTargetLabels: [app, version]
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 15s
